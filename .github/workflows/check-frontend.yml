name: Frontend JavaScript syntax
on:
  push:
    paths:
      - '*.js'
      - '.github/workflows/check-frontend.yml'
  pull_request:
    paths:
      - '*.js'
      - '.github/workflows/check-frontend.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in ./*.js; do
            echo "Checking $file"
            node --check "$file" || exit 1
          done
